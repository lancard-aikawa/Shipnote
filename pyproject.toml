[project]
name = "shipnote"
version = "0.1.0"
description = "Shipnote: GitHub の Release から、Pages のリリース記録・LP のデータと、Zenn の記事の下書きを作る"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
shipnote = "shipnote.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shipnote"]
